[versions]
# libraries
annotations = "26.0.2-1"
codec4j = "0.2.0-beta.4"
gson = "2.13.2"
jackson = "2.20.0"
snakeyaml = "2.5"
serialization = "1.0.0-rc.1"

# testing tool
junit = "6.0.0"

# plugins
gradle-plugins = "1.5.1"

[libraries]

# libraries
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
codec4j = { module = "dev.siroshun.codec4j:codec4j-api", version.ref = "codec4j" }
codec4j-io-memory = { module = "dev.siroshun.codec4j:codec4j-io-memory", version.ref = "codec4j" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
serialization-annotation = { module = "dev.siroshun.serialization:serialization-annotation", version.ref = "serialization" }
serialization-core = { module = "dev.siroshun.serialization:serialization-core", version.ref = "serialization" }

# testing tool
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]

jcommon = { id = "dev.siroshun.gradle.plugins.jcommon", version.ref = "gradle-plugins" }
aggregated-javadoc = { id = "dev.siroshun.gradle.plugins.aggregated-javadoc", version.ref = "gradle-plugins" }
aggregated-javadoc-collector = { id = "dev.siroshun.gradle.plugins.aggregated-javadoc-collector", version.ref = "gradle-plugins" }
mavenCentralPortal = { id = "dev.siroshun.gradle.plugins.maven-central-portal", version.ref = "gradle-plugins" }
mavenPublication = { id = "dev.siroshun.gradle.plugins.maven-publication", version.ref = "gradle-plugins" }
